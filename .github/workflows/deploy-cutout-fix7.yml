name: Deploy Cutout Phase 3D-B

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Cutout Phase 3D-B preview
        uses: actions/checkout@v4
        with:
          repository: thomaslee78-beep/Audrey-Closet
          ref: v13.23-cutout-phase3a
          path: site

      - name: Pre-bake production runtime patch for Preview
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const sw=fs.readFileSync('site/sw.js','utf8');
          const app=fs.readFileSync('site/app.js','utf8');
          const tierStart=sw.indexOf('const TIER_PATCH=String.raw`');
          const withStart=sw.indexOf('function withTierPatch(resp){',tierStart);
          const installStart=sw.indexOf("self.addEventListener('install'",withStart);
          if(tierStart<0||withStart<0||installStart<0) throw new Error('Production runtime patch not found');
          const makePatch=new Function(`${sw.slice(tierStart,withStart)}\n${sw.slice(withStart,installStart)}\nreturn {withTierPatch};`);
          const {withTierPatch}=makePatch();
          (async()=>{
            const response=await withTierPatch(new Response(app,{status:200,headers:{'content-type':'application/javascript; charset=utf-8'}}));
            const patched=await response.text();
            if(!patched.includes('v13.21 baseline — dev12 feature set, fresh delivery')) throw new Error('Production runtime marker missing');
            fs.writeFileSync('site/app.js',patched,'utf8');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Prepare Cutout Phase 3D-B preview
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('site/index.html')
          html=p.read_text(encoding='utf-8')
          swpat=re.compile(r'\n\s*<script>\s*if\s*\(\s*[\'\"]serviceWorker[\'\"]\s+in\s+navigator\s*\)\s*\{.*?navigator\.serviceWorker\.register\(.*?</script>\s*',re.S)
          html,n=swpat.subn('\n',html,count=1)
          if n!=1: raise SystemExit('Production service worker block missing')
          build='13.23-cutout-phase3d-b2'
          html=html.replace('v=13.22-dev26',f'v={build}')
          cleanup='''  <script id="previewServiceWorkerCleanup">\n    if ('serviceWorker' in navigator) {\n      navigator.serviceWorker.getRegistrations().then(function(regs){\n        var ours=regs.filter(function(r){return r.scope.indexOf('/Audrey-Closet-Preview/')!==-1;});\n        if(!ours.length)return;\n        return Promise.all(ours.map(function(r){return r.unregister();})).then(function(){\n          if(!sessionStorage.getItem('audreyCutoutPhase3DB2')){\n            sessionStorage.setItem('audreyCutoutPhase3DB2','1');\n            location.reload();\n          }\n        });\n      });\n    }\n  </script>\n'''
          app_tag=f'  <script src="app.js?v={build}"></script>\n'
          if app_tag not in html: raise SystemExit('Versioned app tag missing')
          html=html.replace(app_tag,cleanup+app_tag,1)
          no_cache='  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n  <meta http-equiv="Pragma" content="no-cache">\n  <meta http-equiv="Expires" content="0">\n'
          if no_cache not in html: html=html.replace('  <meta name="viewport"',no_cache+'  <meta name="viewport"',1)
          manifest=json.loads(Path('site/manifest.webmanifest').read_text(encoding='utf-8'))
          manifest.update({'name':'Audrey Closet — Cutout Preview','short_name':'Audrey Preview','id':'./index.html','start_url':'./index.html','scope':'./'})
          pm='manifest-preview-v13.23-cutout-phase3d-b2.webmanifest'
          Path('site/'+pm).write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          html,count=re.subn(r'(<link\s+[^>]*rel=["\']manifest["\'][^>]*href=["\'])[^"\']+(["\'][^>]*>)',r'\1'+pm+r'\2',html,count=1,flags=re.I)
          if count!=1: raise SystemExit('Manifest link missing')
          html=html.replace('</head>','  <meta name="audrey-preview-build" content="v13.23-cutout-phase3d-b2">\n</head>',1)
          p.write_text(html,encoding='utf-8')
          PY

      - name: Verify Cutout Phase 3D-B preview
        shell: bash
        run: |
          node --check site/photo-cutout-state-v13.23-phase3a.js
          node --check site/photo-cutout-workflow-v13.23-phase3b.js
          node --check site/photo-cutout-pipeline-v13.23-phase3c.js
          node --check site/photo-guided-lifecycle-v13.23-phase3c.js
          node --check site/photo-cutout-save-restore-v13.23-phase3c.js
          node --check site/photo-guided-manual-tools-v13.23-phase3c.js
          node --check site/photo-garment-guides-v13.23-phase3d-a.js
          node --check site/photo-garment-template-picker-v13.23-phase3d-b.js
          node --check site/share-render-v13.21-dev12.js
          python - <<'PY'
          from pathlib import Path
          html=Path('site/index.html').read_text(encoding='utf-8')
          share=Path('site/share-render-v13.21-dev12.js').read_text(encoding='utf-8')
          state=Path('site/photo-cutout-state-v13.23-phase3a.js').read_text(encoding='utf-8')
          workflow=Path('site/photo-cutout-workflow-v13.23-phase3b.js').read_text(encoding='utf-8')
          guides=Path('site/photo-garment-guides-v13.23-phase3d-a.js').read_text(encoding='utf-8')
          picker=Path('site/photo-garment-template-picker-v13.23-phase3d-b.js').read_text(encoding='utf-8')
          assert 'v13.23-cutout-phase3d-b2' in html
          assert 'navigator.serviceWorker.register' not in html
          assert "const BG_PREVIEW='13.23-cutout-phase3d-b2'" in share
          assert 'photo-garment-guides-v13.23-phase3d-a.js' in share
          assert 'photo-garment-template-picker-v13.23-phase3d-b.js' in share
          assert "phase:'3A-fix5'" in state
          assert "phase:'3B-generic1'" in workflow
          assert "phase:'3D-A2'" in guides
          assert "phase:'3D-B1'" in picker
          assert "const ENABLED=['shirt','long-sleeve-shirt']" in picker
          assert "id:'long-sleeve-shirt',label:'Long-Sleeve Shirt',geometryVersion:2" in guides
          assert "defaultPoints:[[.30,.05],[.42,0],[.58,0],[.70,.05],[.98,.19],[.94,.86],[.79,.85],[.73,.34],[.69,1],[.31,1],[.27,.34],[.21,.85],[.06,.86],[.02,.19]]" in guides
          assert "pointLabels:['Left shoulder','Left neck','Right neck','Right shoulder','Right outer sleeve','Right outer cuff','Right inner cuff','Right underarm','Right hem','Left hem','Left underarm','Left inner cuff','Left outer cuff','Left outer sleeve']" in guides
          assert 'migrateLegacyLongSleeve' in guides
          assert 'next.guide.applied=false' in picker and 'next.guide.appliedShape=null' in picker
          assert 'if(state.guide&&guideDef(state.guide.type))return state.guide;' in workflow
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload preview site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
