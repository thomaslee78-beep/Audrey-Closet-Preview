name: Deploy Cutout UI Cleanup 1

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Cutout UI Cleanup preview
        uses: actions/checkout@v4
        with:
          repository: thomaslee78-beep/Audrey-Closet
          ref: v13.23-cutout-ui-cleanup1
          path: site

      - name: Pre-bake production runtime patch for Preview
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const sw=fs.readFileSync('site/sw.js','utf8');
          const app=fs.readFileSync('site/app.js','utf8');
          const tierStart=sw.indexOf('const TIER_PATCH=String.raw`');
          const withStart=sw.indexOf('function withTierPatch(resp){',tierStart);
          const installStart=sw.indexOf("self.addEventListener('install'",withStart);
          if(tierStart<0||withStart<0||installStart<0) throw new Error('Production runtime patch not found');
          const makePatch=new Function(`${sw.slice(tierStart,withStart)}\n${sw.slice(withStart,installStart)}\nreturn {withTierPatch};`);
          const {withTierPatch}=makePatch();
          (async()=>{
            const response=await withTierPatch(new Response(app,{status:200,headers:{'content-type':'application/javascript; charset=utf-8'}}));
            const patched=await response.text();
            if(!patched.includes('v13.21 baseline — dev12 feature set, fresh delivery')) throw new Error('Production runtime marker missing');
            fs.writeFileSync('site/app.js',patched,'utf8');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Prepare Cutout UI Cleanup preview
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('site/index.html')
          html=p.read_text(encoding='utf-8')
          swpat=re.compile(r'\n\s*<script>\s*if\s*\(\s*[\'\"]serviceWorker[\'\"]\s+in\s+navigator\s*\)\s*\{.*?navigator\.serviceWorker\.register\(.*?</script>\s*',re.S)
          html,n=swpat.subn('\n',html,count=1)
          if n!=1: raise SystemExit('Production service worker block missing')
          build='13.23-cutout-ui-cleanup1'
          html=html.replace('v=13.22-dev26',f'v={build}')
          cleanup='''  <script id="previewServiceWorkerCleanup">\n    if ('serviceWorker' in navigator) {\n      navigator.serviceWorker.getRegistrations().then(function(regs){\n        var ours=regs.filter(function(r){return r.scope.indexOf('/Audrey-Closet-Preview/')!==-1;});\n        if(!ours.length)return;\n        return Promise.all(ours.map(function(r){return r.unregister();})).then(function(){\n          if(!sessionStorage.getItem('audreyCutoutUiCleanup1')){\n            sessionStorage.setItem('audreyCutoutUiCleanup1','1');\n            location.reload();\n          }\n        });\n      });\n    }\n  </script>\n'''
          app_tag=f'  <script src="app.js?v={build}"></script>\n'
          if app_tag not in html: raise SystemExit('Versioned app tag missing')
          html=html.replace(app_tag,cleanup+app_tag,1)
          no_cache='  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n  <meta http-equiv="Pragma" content="no-cache">\n  <meta http-equiv="Expires" content="0">\n'
          if no_cache not in html: html=html.replace('  <meta name="viewport"',no_cache+'  <meta name="viewport"',1)
          manifest=json.loads(Path('site/manifest.webmanifest').read_text(encoding='utf-8'))
          manifest.update({'name':'Audrey Closet — Cutout UI Preview','short_name':'Audrey Preview','id':'./index.html','start_url':'./index.html','scope':'./'})
          pm='manifest-preview-v13.23-cutout-ui-cleanup1.webmanifest'
          Path('site/'+pm).write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          html,count=re.subn(r'(<link\s+[^>]*rel=["\']manifest["\'][^>]*href=["\'])[^"\']+(["\'][^>]*>)',r'\1'+pm+r'\2',html,count=1,flags=re.I)
          if count!=1: raise SystemExit('Manifest link missing')
          html=html.replace('</head>','  <meta name="audrey-preview-build" content="v13.23-cutout-ui-cleanup1">\n</head>',1)
          p.write_text(html,encoding='utf-8')
          PY

      - name: Verify Cutout UI Cleanup preview
        shell: bash
        run: |
          node --check site/photo-cutout-state-v13.23-phase3a.js
          node --check site/photo-cutout-workflow-v13.23-phase3b.js
          node --check site/photo-cutout-pipeline-v13.23-phase3c.js
          node --check site/photo-guided-lifecycle-v13.23-phase3c.js
          node --check site/photo-cutout-save-restore-v13.23-phase3c.js
          node --check site/photo-guided-manual-tools-v13.23-phase3c.js
          node --check site/photo-garment-guides-v13.23-phase3d-a.js
          node --check site/photo-garment-template-picker-v13.23-phase3d-b.js
          node --check site/photo-cutout-ui-cleanup-v13.23.js
          node --check site/share-render-v13.21-dev12.js
          python - <<'PY'
          from pathlib import Path
          html=Path('site/index.html').read_text(encoding='utf-8')
          share=Path('site/share-render-v13.21-dev12.js').read_text(encoding='utf-8')
          guides=Path('site/photo-garment-guides-v13.23-phase3d-a.js').read_text(encoding='utf-8')
          picker=Path('site/photo-garment-template-picker-v13.23-phase3d-b.js').read_text(encoding='utf-8')
          ui=Path('site/photo-cutout-ui-cleanup-v13.23.js').read_text(encoding='utf-8')
          assert 'v13.23-cutout-ui-cleanup1' in html
          assert 'navigator.serviceWorker.register' not in html
          assert "const BG_PREVIEW='13.23-cutout-ui-cleanup1'" in share
          assert 'photo-cutout-ui-cleanup-v13.23.js' in share
          assert "phase:'3D-C4'" in guides
          assert "phase:'3D-C2'" in picker
          assert "const ENABLED=['shirt','long-sleeve-shirt','tank','hoodie','pants','dress','shorts','skirt','coat']" in picker
          assert "phase:'cleanup1'" in ui
          assert "easy.textContent='Automatic'" in ui
          assert "guided.textContent='Custom'" in ui
          assert "strong.textContent='Cutout Method'" in ui
          assert 'cutout-method-body' in ui and 'is-collapsed' in ui
          assert 'cutout-guide-settings' in ui
          assert 'garment-template-options{display:flex' in ui
          assert 'Preview lab' not in ui
          assert 'Phase 3B' not in ui
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload preview site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
