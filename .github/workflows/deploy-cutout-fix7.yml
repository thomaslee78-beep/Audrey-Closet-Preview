name: Preview v13.24.1 Tier Idempotency Hotfix

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out v13.24.1 bug-fix branch
        uses: actions/checkout@v4
        with:
          repository: thomaslee78-beep/Audrey-Closet
          ref: bugfix/v13.24.1-tier-idempotency
          path: site

      - name: Prepare Preview runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('site/index.html')
          html=p.read_text(encoding='utf-8')
          build='13.24.1-tier-idempotency-preview1'
          html=re.sub(r'app\.js\?v=[^"\']+',f'app.js?v={build}',html,count=1)

          # Standard Preview intentionally removes SW registration to avoid stale-cache interference.
          swpat=re.compile(r'\n\s*<script>\s*if\s*\(\s*[\'\"]serviceWorker[\'\"]\s+in\s+navigator\s*\)\s*\{.*?navigator\.serviceWorker\.register\(.*?</script>\s*',re.S)
          html,n=swpat.subn('\n',html,count=1)
          if n!=1: raise SystemExit('Production service worker registration block missing')

          cleanup='''  <script id="previewServiceWorkerCleanup">\n    if ('serviceWorker' in navigator) {\n      navigator.serviceWorker.getRegistrations().then(function(regs){\n        var ours=regs.filter(function(r){return r.scope.indexOf('/Audrey-Closet-Preview/')!==-1;});\n        if(!ours.length)return;\n        return Promise.all(ours.map(function(r){return r.unregister();})).then(function(){\n          if(!sessionStorage.getItem('audreyTierIdempotencyPreview1')){sessionStorage.setItem('audreyTierIdempotencyPreview1','1');location.reload();}\n        });\n      });\n    }\n  </script>\n'''
          service=f'''  <script id="audreySmartScanServiceConfig">\n    window.AUDREY_SMART_SCAN_SERVICE_CONFIG = {{enabled:true,endpoint:'https://audrey-smartscan-api.thomaslee78.workers.dev',channel:'preview',build:'{build}'}};\n  </script>\n'''
          marker=f'<script src="app.js?v={build}"></script>'
          if marker not in html: raise SystemExit('app.js marker missing')
          html=html.replace(marker,cleanup+service+'  '+marker,1)
          html=html.replace('</head>',f'  <meta name="audrey-preview-build" content="{build}">\n</head>',1)

          manifest=json.loads(Path('site/manifest.webmanifest').read_text(encoding='utf-8'))
          manifest.update({'name':'Audrey Closet — v13.24.1 Tier Hotfix Preview','short_name':'Audrey Preview','id':'./index.html','start_url':'./index.html','scope':'./'})
          pm='manifest-preview-v13.24.1-tier.webmanifest'
          Path('site/'+pm).write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          html,count=re.subn(r'(<link\s+[^>]*rel=["\']manifest["\'][^>]*href=["\'])[^"\']+(["\'][^>]*>)',r'\1'+pm+r'\2',html,count=1,flags=re.I)
          if count!=1: raise SystemExit('Manifest link missing')
          p.write_text(html,encoding='utf-8')
          PY

      - name: Verify v13.24.1 Tier hotfix
        shell: bash
        run: |
          node --check site/app.js
          node --check site/share-render-v13.21-dev12.js
          node --check site/share-render-v13.24-release.js
          node --check site/legacy-release-compat-v13.24.js
          node --check site/smart-scan-service-v13.24-phase7a4a.js
          node --check site/smart-scan-ai-v13.24-phase7a4-runtime.js
          node --check site/sw-v13.24-release.js
          python - <<'PY'
          from pathlib import Path
          html=Path('site/index.html').read_text(encoding='utf-8')
          boot=Path('site/share-render-v13.24-release.js').read_text(encoding='utf-8')
          compat=Path('site/legacy-release-compat-v13.24.js').read_text(encoding='utf-8')
          service=Path('site/smart-scan-service-v13.24-phase7a4a.js').read_text(encoding='utf-8')
          runtime=Path('site/smart-scan-ai-v13.24-phase7a4-runtime.js').read_text(encoding='utf-8')
          sw=Path('site/sw-v13.24-release.js').read_text(encoding='utf-8')
          assert '13.24.1-tier-idempotency-preview1' in html
          assert "RELEASE='13.24.1-tier-hotfix1'" in boot
          assert 'legacy-release-compat-v13.24.js?v=13.24.1-tier-idempotency1' in boot
          assert "VERSION='13.24.1-tier-idempotency1'" in compat
          assert 'function dedupeTierSelector()' in compat
          assert 'sections.slice(1).forEach(section=>section.remove())' in compat
          assert 'installTierIdempotencyGuard()' in compat
          assert 'MutationObserver' in compat
          assert 'REQUEST_TIMEOUT_MS=25000' in service
          assert 'LOCAL_TIMEOUT_MS=15000' in runtime
          assert 'SCAN_TIMEOUT_MS=45000' in runtime
          assert "CACHE='audrey-closet-v13.24.1-release1'" in sw
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Preview site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Preview
        id: deployment
        uses: actions/deploy-pages@v4
