name: Preview Smart Scan v13.24 Local v1.1 Final

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Smart Scan dev branch
        uses: actions/checkout@v4
        with:
          repository: thomaslee78-beep/Audrey-Closet
          ref: dev/smart-scan-color-pattern-v13.24
          path: site

      - name: Pre-bake production runtime patch for Preview
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const sw=fs.readFileSync('site/sw.js','utf8');
          const app=fs.readFileSync('site/app.js','utf8');
          const tierStart=sw.indexOf('const TIER_PATCH=String.raw`');
          const withStart=sw.indexOf('function withTierPatch(resp){',tierStart);
          const installStart=sw.indexOf("self.addEventListener('install'",withStart);
          if(tierStart<0||withStart<0||installStart<0) throw new Error('Production runtime patch not found');
          const makePatch=new Function(`${sw.slice(tierStart,withStart)}\n${sw.slice(withStart,installStart)}\nreturn {withTierPatch};`);
          const {withTierPatch}=makePatch();
          (async()=>{
            const response=await withTierPatch(new Response(app,{status:200,headers:{'content-type':'application/javascript; charset=utf-8'}}));
            const patched=await response.text();
            fs.writeFileSync('site/app.js',patched,'utf8');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Prepare Preview
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('site/index.html'); html=p.read_text(encoding='utf-8')
          swpat=re.compile(r'\n\s*<script>\s*if\s*\(\s*[\'\"]serviceWorker[\'\"]\s+in\s+navigator\s*\)\s*\{.*?navigator\.serviceWorker\.register\(.*?</script>\s*',re.S)
          html,n=swpat.subn('\n',html,count=1)
          if n!=1: raise SystemExit('Production service worker block missing')
          build='13.24-smart-scan-local-v1-1-final-preview1'
          html=re.sub(r'app\.js\?v=[^"\']+',f'app.js?v={build}',html,count=1)
          cleanup='''  <script id="previewServiceWorkerCleanup">\n    if ('serviceWorker' in navigator) {\n      navigator.serviceWorker.getRegistrations().then(function(regs){\n        return Promise.all(regs.filter(function(r){return r.scope.indexOf('/Audrey-Closet-Preview/')!==-1;}).map(function(r){return r.unregister();}));\n      });\n    }\n  </script>\n'''
          marker=f'<script src="app.js?v={build}"></script>'
          html=html.replace(marker,cleanup+'  '+marker,1)
          html=html.replace('</head>','  <meta name="audrey-preview-build" content="v13.24-smart-scan-local-v1-1-final-preview1">\n</head>',1)
          manifest=json.loads(Path('site/manifest.webmanifest').read_text(encoding='utf-8'))
          manifest.update({'name':'Audrey Closet — Smart Scan Local v1.1 Preview','short_name':'Audrey Preview','id':'./index.html','start_url':'./index.html','scope':'./'})
          pm='manifest-preview-v13.24-smart-scan-local-v1-1.webmanifest'
          Path('site/'+pm).write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          html,count=re.subn(r'(<link\s+[^>]*rel=["\']manifest["\'][^>]*href=["\'])[^"\']+(["\'][^>]*>)',r'\1'+pm+r'\2',html,count=1,flags=re.I)
          if count!=1: raise SystemExit('Manifest link missing')
          p.write_text(html,encoding='utf-8')
          PY

      - name: Verify Local Smart Scan v1.1 Final
        shell: bash
        run: |
          node --check site/app.js
          node --check site/share-render-v13.21-dev12.js
          node --check site/smart-scan-pattern-v13.24-phase5_3.js
          node --check site/smart-scan-pattern-final-v13.24-phase5_4.js
          node --check site/smart-scan-category-v13.24-phase6_2.js
          python - <<'PY'
          from pathlib import Path
          html=Path('site/index.html').read_text(encoding='utf-8')
          share=Path('site/share-render-v13.21-dev12.js').read_text(encoding='utf-8')
          phase54=Path('site/smart-scan-pattern-final-v13.24-phase5_4.js').read_text(encoding='utf-8')
          assert 'v13.24-smart-scan-local-v1-1-final-preview1' in html
          assert "const SMART_SCAN_PHASE54='13.24-phase5.4-final1'" in share
          assert 'smart-scan-pattern-final-v13.24-phase5_4.js?v=' in share
          assert share.index('smart-scan-pattern-v13.24-phase5_3.js') < share.index('smart-scan-pattern-final-v13.24-phase5_4.js') < share.index('smart-scan-category-v13.24-phase6.js')
          assert 'smart-scan-calibration-v13.24-phase6_3a.js' not in share
          assert 'smart-scan-calibration-catalog-v13.24-phase6_3a2.js' not in share
          assert 'smart-scan-pattern-spatial-v13.24-phase5_4-exp.js' not in share
          assert 'smart-scan-pattern-hybrid-v13.24-phase5_4c-exp.js' not in share
          assert "stripeMinScore:.62" in phase54
          assert 'final-strong-plaid' in phase54 and 'final-localized-graphic' in phase54
          assert 'window.analyzeImage=analyzeImagePhase54' in phase54
          assert 'SMART_SCAN_PHASE43' not in share
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Preview site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Preview
        id: deployment
        uses: actions/deploy-pages@v4
