name: Preview Smart Scan v13.24 Phase 4

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Smart Scan Phase 4 branch
        uses: actions/checkout@v4
        with:
          repository: thomaslee78-beep/Audrey-Closet
          ref: dev/smart-scan-color-pattern-v13.24
          path: site

      - name: Pre-bake production runtime patch for Preview
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const sw=fs.readFileSync('site/sw.js','utf8');
          const app=fs.readFileSync('site/app.js','utf8');
          const tierStart=sw.indexOf('const TIER_PATCH=String.raw`');
          const withStart=sw.indexOf('function withTierPatch(resp){',tierStart);
          const installStart=sw.indexOf("self.addEventListener('install'",withStart);
          if(tierStart<0||withStart<0||installStart<0) throw new Error('Production runtime patch not found');
          const makePatch=new Function(`${sw.slice(tierStart,withStart)}\n${sw.slice(withStart,installStart)}\nreturn {withTierPatch};`);
          const {withTierPatch}=makePatch();
          (async()=>{
            const response=await withTierPatch(new Response(app,{status:200,headers:{'content-type':'application/javascript; charset=utf-8'}}));
            const patched=await response.text();
            if(!patched.includes('v13.21 baseline — dev12 feature set, fresh delivery')) throw new Error('Production runtime marker missing');
            fs.writeFileSync('site/app.js',patched,'utf8');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Prepare Smart Scan Preview
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('site/index.html')
          html=p.read_text(encoding='utf-8')
          swpat=re.compile(r'\n\s*<script>\s*if\s*\(\s*[\'\"]serviceWorker[\'\"]\s+in\s+navigator\s*\)\s*\{.*?navigator\.serviceWorker\.register\(.*?</script>\s*',re.S)
          html,n=swpat.subn('\n',html,count=1)
          if n!=1: raise SystemExit('Production service worker block missing')
          build='13.24-smart-scan-phase4-preview1'
          html=re.sub(r'app\.js\?v=[^"\']+',f'app.js?v={build}',html,count=1)
          cleanup='''  <script id="previewServiceWorkerCleanup">\n    if ('serviceWorker' in navigator) {\n      navigator.serviceWorker.getRegistrations().then(function(regs){\n        var ours=regs.filter(function(r){return r.scope.indexOf('/Audrey-Closet-Preview/')!==-1;});\n        if(!ours.length)return;\n        return Promise.all(ours.map(function(r){return r.unregister();})).then(function(){\n          if(!sessionStorage.getItem('audreySmartScanPhase4Preview1')){\n            sessionStorage.setItem('audreySmartScanPhase4Preview1','1');\n            location.reload();\n          }\n        });\n      });\n    }\n  </script>\n'''
          marker=f'<script src="app.js?v={build}"></script>'
          html=html.replace(marker,cleanup+'  '+marker,1)
          no_cache='  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n  <meta http-equiv="Pragma" content="no-cache">\n  <meta http-equiv="Expires" content="0">\n'
          if no_cache not in html: html=html.replace('  <meta name="viewport"',no_cache+'  <meta name="viewport"',1)
          manifest=json.loads(Path('site/manifest.webmanifest').read_text(encoding='utf-8'))
          manifest.update({'name':'Audrey Closet — Smart Scan Phase 4 Preview','short_name':'Audrey Preview','id':'./index.html','start_url':'./index.html','scope':'./'})
          pm='manifest-preview-v13.24-smart-scan-phase4.webmanifest'
          Path('site/'+pm).write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          html,count=re.subn(r'(<link\s+[^>]*rel=["\']manifest["\'][^>]*href=["\'])[^"\']+(["\'][^>]*>)',r'\1'+pm+r'\2',html,count=1,flags=re.I)
          if count!=1: raise SystemExit('Manifest link missing')
          html=html.replace('</head>','  <meta name="audrey-preview-build" content="v13.24-smart-scan-phase4-preview1">\n</head>',1)
          p.write_text(html,encoding='utf-8')
          PY

      - name: Verify Smart Scan Phase 4
        shell: bash
        run: |
          node --check site/app.js
          node --check site/share-render-v13.21-dev12.js
          node --check site/smart-scan-baseline-v13.24-phase1.js
          node --check site/smart-scan-sampling-v13.24-phase2.js
          node --check site/smart-scan-dominant-color-v13.24-phase3.js
          node --check site/smart-scan-color-calibration-v13.24-phase4.js
          python - <<'PY'
          from pathlib import Path
          html=Path('site/index.html').read_text(encoding='utf-8')
          share=Path('site/share-render-v13.21-dev12.js').read_text(encoding='utf-8')
          phase4=Path('site/smart-scan-color-calibration-v13.24-phase4.js').read_text(encoding='utf-8')
          assert 'v13.24-smart-scan-phase4-preview1' in html
          assert "const SMART_SCAN_PHASE4='13.24-phase4-lab1'" in share
          assert 'smart-scan-color-calibration-v13.24-phase4.js?v=' in share
          assert 'function rgbToLab' in phase4
          assert 'function nearestColorLab' in phase4
          assert 'clusterPrimaryScore' in phase4
          assert "if(name==='Black'&&C>=12)" in phase4
          assert 'window.analyzeImage=analyzeImagePhase4' in phase4
          assert 'dark-neutral suppression enabled' in phase4
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Preview site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Preview
        id: deployment
        uses: actions/deploy-pages@v4
