name: Preview Smart Scan v13.24 Phase 7A1 API Test

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Smart Scan dev branch
        uses: actions/checkout@v4
        with:
          repository: thomaslee78-beep/Audrey-Closet
          ref: dev/smart-scan-color-pattern-v13.24
          path: site

      - name: Pre-bake production runtime patch for Preview
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const sw=fs.readFileSync('site/sw.js','utf8');
          const app=fs.readFileSync('site/app.js','utf8');
          const tierStart=sw.indexOf('const TIER_PATCH=String.raw`');
          const withStart=sw.indexOf('function withTierPatch(resp){',tierStart);
          const installStart=sw.indexOf("self.addEventListener('install'",withStart);
          if(tierStart<0||withStart<0||installStart<0) throw new Error('Production runtime patch not found');
          const makePatch=new Function(`${sw.slice(tierStart,withStart)}\n${sw.slice(withStart,installStart)}\nreturn {withTierPatch};`);
          const {withTierPatch}=makePatch();
          (async()=>{
            const response=await withTierPatch(new Response(app,{status:200,headers:{'content-type':'application/javascript; charset=utf-8'}}));
            const patched=await response.text();
            const marker='v13.21 baseline — dev12 feature set, fresh delivery';
            const count=patched.split(marker).length-1;
            if(count!==1) throw new Error(`Preview app.js expected exactly one Tier patch, found ${count}`);
            fs.writeFileSync('site/app.js',patched,'utf8');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Prepare Preview
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('site/index.html'); html=p.read_text(encoding='utf-8')
          swpat=re.compile(r'\n\s*<script>\s*if\s*\(\s*[\'\"]serviceWorker[\'\"]\s+in\s+navigator\s*\)\s*\{.*?navigator\.serviceWorker\.register\(.*?</script>\s*',re.S)
          html,n=swpat.subn('\n',html,count=1)
          if n!=1: raise SystemExit('Production service worker block missing')
          build='13.24-smart-scan-phase7a1-api-test-preview2'
          html=re.sub(r'app\.js\?v=[^"\']+',f'app.js?v={build}',html,count=1)
          cleanup='''  <script id="previewServiceWorkerCleanup">\n    if ('serviceWorker' in navigator) {\n      navigator.serviceWorker.getRegistrations().then(function(regs){\n        var ours=regs.filter(function(r){return r.scope.indexOf('/Audrey-Closet-Preview/')!==-1;});\n        if(!ours.length)return;\n        return Promise.all(ours.map(function(r){return r.unregister();})).then(function(){\n          if(!sessionStorage.getItem('audreySmartScanPhase7A1ApiTestPreview2')){\n            sessionStorage.setItem('audreySmartScanPhase7A1ApiTestPreview2','1');\n            location.reload();\n          }\n        });\n      });\n    }\n  </script>\n'''
          marker=f'<script src="app.js?v={build}"></script>'
          repair='  <script src="tier-preview-regression-fix-v13.24.js?v=13.24-tier-preview-regression-fix1"></script>\n'
          html=html.replace(marker,cleanup+'  '+marker+'\n'+repair,1)
          html=html.replace('</head>','  <meta name="audrey-preview-build" content="v13.24-smart-scan-phase7a1-api-test-preview2">\n</head>',1)
          manifest=json.loads(Path('site/manifest.webmanifest').read_text(encoding='utf-8'))
          manifest.update({'name':'Audrey Closet — Smart Scan AI Preview','short_name':'Audrey Preview','id':'./index.html','start_url':'./index.html','scope':'./'})
          pm='manifest-preview-v13.24-smart-scan-phase7a1-api-test.webmanifest'
          Path('site/'+pm).write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          html,count=re.subn(r'(<link\s+[^>]*rel=["\']manifest["\'][^>]*href=["\'])[^"\']+(["\'][^>]*>)',r'\1'+pm+r'\2',html,count=1,flags=re.I)
          if count!=1: raise SystemExit('Manifest link missing')
          p.write_text(html,encoding='utf-8')
          PY

      - name: Verify Smart Scan Phase 7A1 API test
        shell: bash
        run: |
          node --check site/app.js
          node --check site/share-render-v13.21-dev12.js
          node --check site/smart-scan-contract-v13.24-phase6_3.js
          node --check site/smart-scan-ai-v13.24-phase7a1.js
          node --check site/tier-preview-regression-fix-v13.24.js
          python - <<'PY'
          from pathlib import Path
          html=Path('site/index.html').read_text(encoding='utf-8')
          app=Path('site/app.js').read_text(encoding='utf-8')
          share=Path('site/share-render-v13.21-dev12.js').read_text(encoding='utf-8')
          contract=Path('site/smart-scan-contract-v13.24-phase6_3.js').read_text(encoding='utf-8')
          ai=Path('site/smart-scan-ai-v13.24-phase7a1.js').read_text(encoding='utf-8')
          tierfix=Path('site/tier-preview-regression-fix-v13.24.js').read_text(encoding='utf-8')
          assert 'v13.24-smart-scan-phase7a1-api-test-preview2' in html
          assert app.count('v13.21 baseline — dev12 feature set, fresh delivery') == 1
          assert 'syncCatalogTierRibbons' in tierfix and 'dedupeTierSelector' in tierfix
          assert "const SMART_SCAN_PHASE63='13.24-phase6.3-contract1'" in share
          assert "const SMART_SCAN_PHASE7A1='13.24-phase7a1-config-adapter2'" in share
          assert share.index('smart-scan-contract-v13.24-phase6_3.js') < share.index('smart-scan-ai-v13.24-phase7a1.js')
          assert "const VERSION='13.24-phase7a1-config-adapter2'" in ai
          assert 'Test API connection' in ai
          assert 'async function testConnection()' in ai
          assert "https://api.openai.com/v1/models/" in ai
          assert "Authorization:'Bearer '+cfg.apiKey" in ai
          assert 'API.lastConnectionTest=result' in ai
          assert "AI_TRANSPORT_NOT_IMPLEMENTED" in ai
          assert 'window.smartScan=async function' not in ai
          assert 'pendingSmartScanResult=toPendingFlat(result)' in contract
          assert 'smart-scan-calibration-v13.24-phase6_3a.js' not in share
          assert 'SMART_SCAN_PHASE43' not in share
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Preview site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Preview
        id: deployment
        uses: actions/deploy-pages@v4
