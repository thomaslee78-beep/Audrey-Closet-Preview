name: Deploy v13.25 Phase 3 Preview

on:
  push:
    paths:
      - '.v1325-phase1-trigger'
      - '.github/workflows/deploy-v13.25-phase1.yml'
      - '.github/scripts/build-v13.25-preview.py'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: audrey-v13-25-phase1-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout v13.25 source branch
        uses: actions/checkout@v4
        with:
          repository: thomaslee78-beep/Audrey-Closet
          ref: dev/v13.25-outfit-workflow-contextual-journal
          path: source
          fetch-depth: 1

      - name: Checkout preview repository
        uses: actions/checkout@v4
        with:
          path: preview
          fetch-depth: 0

      - name: Build deterministic preview
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git' --exclude='.github' source/ preview/
          python3 preview/.github/scripts/build-v13.25-preview.py
          test -f preview/index.html
          test -f preview/app.js
          test -f preview/sticker-studio-v13.22-release.js
          test -f preview/sticker-render-compat-v13.23.1.js
          test -f preview/v13.25-phase3-era-foundation.js
          test -f preview/v13.25-phase3-era-immediate-refresh-fix.js
          test -f preview/v13.25-phase3-journal-creative-page-v1.js
          test -f preview/v13.25-phase3-journal-creative-page-refinements.js
          test -f preview/v13.25-phase3-journal-sticker-interaction-polish.js
          test -f preview/v13.25-phase3-journal-sticker-surface-v2.js
          test -f preview/v13.25-phase3-wear-log-layout2.js
          test -f preview/v13.25-phase3-wear-log-detail-polish.js
          test -f preview/v13.25-phase3-wear-log-interaction-fixes.js
          test -f preview/v13.25-phase3-journal-editor-layout.js
          test -f preview/v13.25-phase3-journal-editor-refinements.js
          test -f preview/v13.25-phase3-journal-layout-hardening.js
          test -f preview/v13.25-phase3-journal-row-polish2.js
          test -f preview/v13.25-phase3-journal-row-final.js
          test -f preview/v13.25-phase3-journal-row-spacing-final.js
          test -f preview/v13.25-phase3-journal-reader-refinements.js
          test -f preview/photo-studio-reopen-snapshot-hotfix-v13.24.js
          test -f preview/photo-studio-state-integrity-hotfix-v13.24.js
          grep -q 'audrey-preview-build" content="v13.25-phase3-dev3-layout53' preview/index.html
          grep -q 'v13.25-phase3-journal-creative-page-refinements.js?v=phase3-dev3-layout53' preview/index.html
          grep -q 'v13.25-phase3-journal-sticker-interaction-polish.js?v=phase3-dev3-layout53' preview/index.html
          grep -q 'v13.25-phase3-journal-sticker-surface-v2.js?v=phase3-dev3-layout53' preview/index.html
          grep -q 'v13.25-phase3-wear-log-interaction-fixes.js?v=phase3-dev3-layout53' preview/index.html
          grep -q 'v13.25-phase3-journal-row-final.js?v=phase3-dev3-layout53' preview/index.html
          grep -q 'v13.25-phase3-journal-reader-refinements.js?v=phase3-dev3-layout53' preview/index.html

      - name: Publish preview repository
        shell: bash
        working-directory: preview
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Preview repository already current.'
          else
            git commit -m 'Deploy v13.25 Phase 3 Journal Done-save layout53'
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Preview site
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview

      - name: Deploy Preview Pages
        id: deployment
        uses: actions/deploy-pages@v4
