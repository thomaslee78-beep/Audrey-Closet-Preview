name: Deploy v13.25 Phase 4 Preview

on:
  push:
    paths:
      - '.v1325-phase1-trigger'
      - '.github/workflows/deploy-v13.25-phase1.yml'
      - '.github/scripts/build-v13.25-preview.py'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: audrey-v13-25-phase1-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout v13.25 source branch
        uses: actions/checkout@v4
        with:
          repository: thomaslee78-beep/Audrey-Closet
          ref: dev/v13.25-outfit-workflow-contextual-journal
          path: source
          fetch-depth: 1

      - name: Checkout preview repository
        uses: actions/checkout@v4
        with:
          path: preview
          fetch-depth: 0

      - name: Build deterministic preview
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git' --exclude='.github' source/ preview/
          python3 preview/.github/scripts/build-v13.25-preview.py
          test -f preview/index.html
          test -f preview/app.js
          test -f preview/v13.25-phase4-context-enrichment.js
          grep -q 'audrey-preview-build" content="v13.25-phase4-layout58' preview/index.html
          grep -q 'v13.25-phase4-context-enrichment.js?v=phase4-layout58' preview/index.html
          grep -q 'v13.25-phase3-journal-layout-hardening.js?v=phase4-layout58' preview/index.html
          grep -q 'v13.25-phase3-journal-sticker-surface-v2.js?v=phase4-layout58' preview/index.html
          grep -q 'v13.25-phase3-journal-done-exit-fix.js?v=phase4-layout58' preview/index.html
          grep -q 'v13.25-phase3-journal-row-final.js?v=phase4-layout58' preview/index.html
          grep -q 'v13.25-phase3-journal-reader-refinements.js?v=phase4-layout58' preview/index.html

      - name: Publish preview repository
        shell: bash
        working-directory: preview
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Preview repository already current.'
          else
            git commit -m 'Deploy v13.25 Phase 4 Journal title focus hardening layout58'
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Preview site
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview

      - name: Deploy Preview Pages
        id: deployment
        uses: actions/deploy-pages@v4
