name: Deploy Audrey Closet Preview

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out background removal Phase 1F preview
        uses: actions/checkout@v4
        with:
          repository: thomaslee78-beep/Audrey-Closet
          ref: v13.23-background-removal-preview-phase1a
          path: site

      - name: Pre-bake production runtime patch for Preview
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const sw=fs.readFileSync('site/sw.js','utf8');
          const app=fs.readFileSync('site/app.js','utf8');
          const tierStart=sw.indexOf('const TIER_PATCH=String.raw`');
          const withStart=sw.indexOf('function withTierPatch(resp){',tierStart);
          const installStart=sw.indexOf("self.addEventListener('install'",withStart);
          if(tierStart<0||withStart<0||installStart<0) throw new Error('Production runtime patch not found');
          const makePatch=new Function(`${sw.slice(tierStart,withStart)}\n${sw.slice(withStart,installStart)}\nreturn {withTierPatch};`);
          const {withTierPatch}=makePatch();
          (async()=>{
            const response=await withTierPatch(new Response(app,{status:200,headers:{'content-type':'application/javascript; charset=utf-8'}}));
            const patched=await response.text();
            if(!patched.includes('v13.21 baseline — dev12 feature set, fresh delivery')) throw new Error('Production runtime marker missing');
            fs.writeFileSync('site/app.js',patched,'utf8');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Prepare background removal preview
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('site/index.html')
          html=p.read_text(encoding='utf-8')
          swpat=re.compile(r'\n\s*<script>\s*if\s*\(\s*[\'\"]serviceWorker[\'\"]\s+in\s+navigator\s*\)\s*\{.*?navigator\.serviceWorker\.register\(.*?</script>\s*',re.S)
          html,n=swpat.subn('\n',html,count=1)
          if n!=1: raise SystemExit('Production service worker block missing')
          build='13.23-bg-phase1f'
          html=html.replace('v=13.22-dev26',f'v={build}')
          cleanup='''  <script id="previewServiceWorkerCleanup">\n    if ('serviceWorker' in navigator) {\n      navigator.serviceWorker.getRegistrations().then(function(regs){\n        var ours=regs.filter(function(r){return r.scope.indexOf('/Audrey-Closet-Preview/')!==-1;});\n        if(!ours.length)return;\n        return Promise.all(ours.map(function(r){return r.unregister();})).then(function(){\n          if(!sessionStorage.getItem('audreyBgPhase1F')){\n            sessionStorage.setItem('audreyBgPhase1F','1');\n            location.reload();\n          }\n        });\n      });\n    }\n  </script>\n'''
          app_tag=f'  <script src="app.js?v={build}"></script>\n'
          if app_tag not in html: raise SystemExit('Versioned app tag missing')
          html=html.replace(app_tag,cleanup+app_tag,1)
          no_cache='  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n  <meta http-equiv="Pragma" content="no-cache">\n  <meta http-equiv="Expires" content="0">\n'
          if no_cache not in html: html=html.replace('  <meta name="viewport"',no_cache+'  <meta name="viewport"',1)
          manifest=json.loads(Path('site/manifest.webmanifest').read_text(encoding='utf-8'))
          manifest.update({'name':'Audrey Closet — Background Preview','short_name':'Audrey Preview','id':'./index.html','start_url':'./index.html','scope':'./'})
          pm='manifest-preview-v13.23-bg-phase1f.webmanifest'
          Path('site/'+pm).write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          html,count=re.subn(r'(<link\s+[^>]*rel=["\']manifest["\'][^>]*href=["\'])[^"\']+(["\'][^>]*>)',r'\1'+pm+r'\2',html,count=1,flags=re.I)
          if count!=1: raise SystemExit('Manifest link missing')
          html=html.replace('</head>','  <meta name="audrey-preview-build" content="v13.23-bg-phase1f">\n</head>',1)
          p.write_text(html,encoding='utf-8')
          PY

      - name: Verify Shirt Guide Phase 1F preview
        shell: bash
        run: |
          node --check site/photo-cutout-methods-v13.23-preview1.js
          node --check site/photo-cutout-method-persist-v13.23-preview2.js
          node --check site/photo-garment-guide-v13.23-preview1f.js
          node --check site/share-render-v13.21-dev12.js
          python - <<'PY'
          from pathlib import Path
          html=Path('site/index.html').read_text(encoding='utf-8')
          app=Path('site/app.js').read_text(encoding='utf-8')
          share=Path('site/share-render-v13.21-dev12.js').read_text(encoding='utf-8')
          methods=Path('site/photo-cutout-methods-v13.23-preview1.js').read_text(encoding='utf-8')
          persist=Path('site/photo-cutout-method-persist-v13.23-preview2.js').read_text(encoding='utf-8')
          guide=Path('site/photo-garment-guide-v13.23-preview1f.js').read_text(encoding='utf-8')
          assert 'v13.23-bg-phase1f' in html
          assert 'navigator.serviceWorker.register' not in html
          assert 'v13.21 baseline — dev12 feature set, fresh delivery' in app
          assert "const BG_PREVIEW='13.23-bg-phase1f'" in share
          assert 'photo-garment-guide-v13.23-preview1f.js' in share
          assert 'photo-garment-guide-v13.23-preview1.js' not in share
          assert 'Smart Blend' not in methods and methods.count('enabled:true')==4
          assert "'blend'" not in persist
          assert "phase:'1F'" in guide and "type:'shirt'" in guide
          assert 'studioShirtGuideLock' in guide
          assert 'Position locked' in guide and 'Lock position' in guide
          assert 'studio-shirt-guide-rotate' in guide
          assert "kind:'rotate'" in guide
          assert 'guide.rotation' in guide
          assert '-guide.w/2+m' in guide and '720+guide.w/2-m' in guide
          assert '-guide.h/2+m' in guide and '720+guide.h/2-m' in guide
          assert '-webkit-touch-callout:none' in guide
          assert "'contextmenu','selectstart','dragstart'" in guide
          assert 'studioShirtGuideWidth' not in guide
          assert 'studioShirtGuideHeight' not in guide
          assert 'studioShirtGuideProtection' not in guide
          assert 'acceptedBase' in guide and 'exactCanvas' in guide
          assert "raw?.mode==='quick'" in guide
          assert 'follow(' in guide
          assert 'studioViewZoom=1' in guide and 'studioViewX=0' in guide and 'studioViewY=0' in guide
          assert 'drop-shadow(0 0 2px #fff)' in guide
          assert 'text-shadow:' in guide
          assert 'getState:state' in guide
          assert 'garmentGuide' in persist and 'stampWorkingStudioState' in persist
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload preview site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
