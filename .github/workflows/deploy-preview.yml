name: Deploy Audrey Closet Preview

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out v13.23 Portfolio Mini Fidelity hotfix
        uses: actions/checkout@v4
        with:
          repository: thomaslee78-beep/Audrey-Closet
          ref: hotfix/v13.23-share-stickers
          path: site

      - name: Pre-bake production runtime patch for Preview
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const sw=fs.readFileSync('site/sw.js','utf8');
          const app=fs.readFileSync('site/app.js','utf8');
          const tierStart=sw.indexOf('const TIER_PATCH=String.raw`');
          const withStart=sw.indexOf('function withTierPatch(resp){',tierStart);
          const installStart=sw.indexOf("self.addEventListener('install'",withStart);
          if(tierStart<0||withStart<0||installStart<0) throw new Error('Production runtime patch not found');
          const makePatch=new Function(`${sw.slice(tierStart,withStart)}\n${sw.slice(withStart,installStart)}\nreturn {withTierPatch};`);
          const {withTierPatch}=makePatch();
          (async()=>{
            const response=await withTierPatch(new Response(app,{status:200,headers:{'content-type':'application/javascript; charset=utf-8'}}));
            const patched=await response.text();
            if(!patched.includes('v13.21 baseline — dev12 feature set, fresh delivery')) throw new Error('Production runtime marker missing');
            fs.writeFileSync('site/app.js',patched,'utf8');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Prepare Portfolio Mini Fidelity v13.23.6 candidate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('site/index.html')
          html=p.read_text(encoding='utf-8')
          swpat=re.compile(r'\n\s*<script>\s*if\s*\(\s*[\'\"]serviceWorker[\'\"]\s+in\s+navigator\s*\)\s*\{.*?navigator\.serviceWorker\.register\(.*?</script>\s*',re.S)
          html,n=swpat.subn('\n',html,count=1)
          if n!=1: raise SystemExit('Production service worker block missing')
          html=html.replace('app.js?v=13.22-dev26','app.js?v=13.23.6-portfolio-mini-fidelity')
          html=html.replace('share-render-v13.21-dev12.js?v=13.21-dev12','share-render-v13.21-dev12.js?v=13.23.6-portfolio-mini-fidelity')
          cleanup='''  <script id="previewServiceWorkerCleanup">\n    if ('serviceWorker' in navigator) {\n      navigator.serviceWorker.getRegistrations().then(function(regs){\n        var ours=regs.filter(function(r){return r.scope.indexOf('/Audrey-Closet-Preview/')!==-1;});\n        if(!ours.length)return;\n        return Promise.all(ours.map(function(r){return r.unregister();})).then(function(){\n          if(!sessionStorage.getItem('audreyPreviewPortfolioMiniV13236b')){\n            sessionStorage.setItem('audreyPreviewPortfolioMiniV13236b','1');\n            location.reload();\n          }\n        });\n      });\n    }\n  </script>\n'''
          app_tag='  <script src="app.js?v=13.23.6-portfolio-mini-fidelity"></script>\n'
          if app_tag not in html: raise SystemExit('Versioned app tag missing')
          html=html.replace(app_tag,cleanup+app_tag,1)
          no_cache='  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n  <meta http-equiv="Pragma" content="no-cache">\n  <meta http-equiv="Expires" content="0">\n'
          if no_cache not in html: html=html.replace('  <meta name="viewport"',no_cache+'  <meta name="viewport"',1)
          manifest=json.loads(Path('site/manifest.webmanifest').read_text(encoding='utf-8'))
          manifest.update({'name':'Audrey Closet — Portfolio Mini Fidelity v13.23.6','short_name':'Audrey Mini','id':'./sticker-release-candidate.html','start_url':'./sticker-release-candidate.html','scope':'./'})
          pm='manifest-preview-v13.23.6-portfolio-mini-fidelity.webmanifest'
          Path('site/'+pm).write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          html,count=re.subn(r'(<link\s+[^>]*rel=["\']manifest["\'][^>]*href=["\'])[^"\']+(["\'][^>]*>)',r'\1'+pm+r'\2',html,count=1,flags=re.I)
          if count!=1: raise SystemExit('Manifest link missing')
          html=html.replace('</head>','  <meta name="audrey-preview-build" content="v13.23.6-portfolio-mini-fidelity-letterbox">\n</head>',1)
          Path('site/sticker-release-candidate.html').write_text(html,encoding='utf-8')
          PY

      - name: Verify Portfolio Mini Fidelity v13.23.6 composition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('site/sticker-release-candidate.html').read_text(encoding='utf-8')
          boot=Path('site/share-render-v13.21-dev12.js').read_text(encoding='utf-8')
          mini=Path('site/portfolio-mini-fidelity-v13.23.6.js').read_text(encoding='utf-8')
          text=Path('site/board-text-layout-v13.23.5.js').read_text(encoding='utf-8')
          assert 'v13.23.6-portfolio-mini-fidelity-letterbox' in html
          assert "HOTFIX='13.23.6-portfolio-mini-fidelity'" in boot
          assert 'portfolio-mini-fidelity-v13.23.6.js?v=' in boot
          assert boot.index('board-text-layout-v13.23.5.js?v=') < boot.index('portfolio-mini-fidelity-v13.23.6.js?v=')
          assert boot.index('sticker-render-compat-v13.23.1.js?v=') < boot.index('portfolio-mini-fidelity-v13.23.6.js?v=')
          for needle in ['portfolio-mini-plane-v13236','Math.min(cw/sw,ch/sh)','fontCqw=(size.px/g.sw)*100','ResizeObserver','sizeMiniPlane','portfolio-text-fidelity-v13236']:
            assert needle in mini, f'missing mini fidelity marker: {needle}'
          assert 'Math.max(8' not in mini, 'legacy 8% clamp copied into Mini Fidelity module'
          assert 'font-size:min(' not in mini, 'old dual-axis font scaling still present'
          for needle in ["small:{label:'S',px:20","medium:{label:'M',px:28","large:{label:'L',px:38","xlarge:{label:'XL',px:50"]:
            assert needle in text, f'missing shared size marker: {needle}'
          assert 'navigator.serviceWorker.register' not in html
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload preview site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
