name: Deploy Audrey Closet Preview

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out v13.23 release candidate
        uses: actions/checkout@v4
        with:
          repository: thomaslee78-beep/Audrey-Closet
          ref: release/v13.23-decorate
          path: site

      - name: Pre-bake production runtime patch for Preview
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const sw=fs.readFileSync('site/sw.js','utf8');
          const app=fs.readFileSync('site/app.js','utf8');
          const tierStart=sw.indexOf('const TIER_PATCH=String.raw`');
          const withStart=sw.indexOf('function withTierPatch(resp){',tierStart);
          const installStart=sw.indexOf("self.addEventListener('install'",withStart);
          if(tierStart<0||withStart<0||installStart<0) throw new Error('Production runtime patch not found');
          const makePatch=new Function(`${sw.slice(tierStart,withStart)}\n${sw.slice(withStart,installStart)}\nreturn {withTierPatch};`);
          const {withTierPatch}=makePatch();
          (async()=>{
            const response=await withTierPatch(new Response(app,{status:200,headers:{'content-type':'application/javascript; charset=utf-8'}}));
            const patched=await response.text();
            if(!patched.includes('v13.21 baseline — dev12 feature set, fresh delivery')) throw new Error('Production runtime marker missing');
            fs.writeFileSync('site/app.js',patched,'utf8');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Prepare source-equivalent release candidate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('site/index.html')
          html=p.read_text(encoding='utf-8')

          # Preview must never register the production worker.
          swpat=re.compile(r'\n\s*<script>\s*if\s*\(\s*[\'\"]serviceWorker[\'\"]\s+in\s+navigator\s*\)\s*\{.*?navigator\.serviceWorker\.register\(.*?</script>\s*',re.S)
          html,n=swpat.subn('\n',html,count=1)
          if n!=1: raise SystemExit('Production service worker block missing')

          # Bust only the core resources whose contents changed for this release.
          html=html.replace('app.js?v=13.22-dev26','app.js?v=13.23-release-rc1')
          html=html.replace('share-render-v13.21-dev12.js?v=13.21-dev12','share-render-v13.21-dev12.js?v=13.23-release-rc1')
          html=html.replace('shape-studio-v13.22-dev1.js?v=13.22-dev1','shape-studio-v13.22-dev1.js?v=13.23-release-rc1')
          html=html.replace('shape-studio-v13.22-dev3.js?v=13.22-dev3','shape-studio-v13.22-dev3.js?v=13.23-release-rc1')

          cleanup='''  <script id="previewServiceWorkerCleanup">\n    if ('serviceWorker' in navigator) {\n      navigator.serviceWorker.getRegistrations().then(function(regs){\n        var ours=regs.filter(function(r){return r.scope.indexOf('/Audrey-Closet-Preview/')!==-1;});\n        if(!ours.length)return;\n        return Promise.all(ours.map(function(r){return r.unregister();})).then(function(){\n          if(!sessionStorage.getItem('audreyPreviewV1323ReleaseRC1')){\n            sessionStorage.setItem('audreyPreviewV1323ReleaseRC1','1');\n            location.reload();\n          }\n        });\n      });\n    }\n  </script>\n'''
          app_tag='  <script src="app.js?v=13.23-release-rc1"></script>\n'
          if app_tag not in html: raise SystemExit('Versioned app tag missing')
          html=html.replace(app_tag,cleanup+app_tag,1)

          no_cache='  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n  <meta http-equiv="Pragma" content="no-cache">\n  <meta http-equiv="Expires" content="0">\n'
          if no_cache not in html: html=html.replace('  <meta name="viewport"',no_cache+'  <meta name="viewport"',1)

          manifest=json.loads(Path('site/manifest.webmanifest').read_text(encoding='utf-8'))
          manifest.update({
            'name':'Audrey Closet — v13.23 Release Candidate',
            'short_name':'Audrey RC',
            'id':'./sticker-release-candidate.html',
            'start_url':'./sticker-release-candidate.html',
            'scope':'./'
          })
          pm='manifest-preview-v13.23-release.webmanifest'
          Path('site/'+pm).write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          html,count=re.subn(r'(<link\s+[^>]*rel=["\']manifest["\'][^>]*href=["\'])[^"\']+(["\'][^>]*>)',r'\1'+pm+r'\2',html,count=1,flags=re.I)
          if count!=1: raise SystemExit('Manifest link missing')
          html=html.replace('</head>','  <meta name="audrey-preview-build" content="v13.23-source-equivalent-rc1">\n</head>',1)
          Path('site/sticker-release-candidate.html').write_text(html,encoding='utf-8')
          PY

      - name: Verify source-equivalent release composition
        shell: bash
        run: |
          grep -q 'v13.23-source-equivalent-rc1' site/sticker-release-candidate.html
          grep -q 'production release bootstrap' site/share-render-v13.21-dev12.js
          grep -q 'share-render-v13.21-dev12-core.js?v=13.23-release' site/share-render-v13.21-dev12.js
          grep -q 'draw-studio-v13.22-dev17.js?v=13.23-release' site/share-render-v13.21-dev12.js
          grep -q 'board-focus-v13.22-dev10.js?v=13.23-release' site/share-render-v13.21-dev12.js
          grep -q 'decorate-function-layout-v13.22-proto1.js?v=13.23-release' site/share-render-v13.21-dev12.js
          grep -q "borderStyle:String(s.borderStyle||'solid')==='dashed'?'dashed':'solid'" site/shape-studio-v13.22-dev1.js
          grep -q '__audreyShapeStudioV132206?.shapeMarkup' site/shape-studio-v13.22-dev3.js
          grep -q 'REGISTRY_VERSION=3' site/sticker-studio-v13.22-release.js
          ! grep -q "id:'emoji'" site/sticker-studio-v13.22-release.js
          test -f site/decorate-rail-v13.22-proto1.js
          test -f site/decorate-function-layout-v13.22-proto1.js
          test -f site/share-export-compat-v13.22-dev1.js
          test -f site/assets/stickers/music/amp-stack.svg
          test -f site/assets/stickers/fashion/hanger-wood.svg
          ! grep -q "navigator.serviceWorker.register" site/sticker-release-candidate.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload preview site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
