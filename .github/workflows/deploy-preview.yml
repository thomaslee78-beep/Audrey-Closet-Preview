name: Deploy Audrey Closet Preview

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Draw development branch
        uses: actions/checkout@v4
        with:
          repository: thomaslee78-beep/Audrey-Closet
          ref: v13.22-draw-clean-dev1
          path: site

      - name: Prepare cache-free preview runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('site/index.html')
          html = p.read_text(encoding='utf-8')

          # Keep Draw development isolated and cache-busted per build.
          old_tags = [
              '  <script src="draw-studio-v13.22-dev1.js?v=13.22-draw-clean-dev1"></script>\n',
              '  <script src="draw-studio-v13.22-dev2.js?v=13.22-draw-clean-dev2"></script>\n',
              '  <script src="draw-studio-v13.22-dev2-fix1.js?v=13.22-draw-dev2-fix1"></script>\n',
          ]
          draw_tag = '  <script src="draw-studio-v13.22-dev3.js?v=13.22-draw-dev3"></script>\n'
          anchor = '  <script src="shape-studio-v13.22-dev26.js?v=13.22-dev26"></script>\n'
          for old in old_tags:
              html = html.replace(old, '')
          if draw_tag not in html:
              if anchor not in html:
                  raise SystemExit('Expected Shape Studio script anchor not found')
              html = html.replace(anchor, anchor + draw_tag, 1)

          # Preview must never register the production-style PWA service worker.
          sw_pattern = re.compile(
              r'\n\s*<script>\s*if\s*\(\s*[\'\"]serviceWorker[\'\"]\s+in\s+navigator\s*\)\s*\{.*?navigator\.serviceWorker\.register\(.*?</script>\s*',
              re.S,
          )
          html, removed = sw_pattern.subn('\n', html, count=1)
          if removed != 1:
              raise SystemExit('Expected service-worker registration block not found')

          # One-time transition cleanup: unregister only this Preview repo scope.
          cleanup = '''  <script id="previewServiceWorkerCleanup">\n    if ('serviceWorker' in navigator) {\n      navigator.serviceWorker.getRegistrations().then(function (registrations) {\n        var previewRegs = registrations.filter(function (registration) {\n          return registration.scope.indexOf('/Audrey-Closet-Preview/') !== -1;\n        });\n        if (!previewRegs.length) return;\n        return Promise.all(previewRegs.map(function (registration) { return registration.unregister(); }))\n          .then(function () {\n            if (!sessionStorage.getItem('audreyPreviewSwCleaned')) {\n              sessionStorage.setItem('audreyPreviewSwCleaned', '1');\n              location.reload();\n            }\n          });\n      }).catch(function (error) { console.warn('Preview service-worker cleanup failed', error); });\n    }\n  </script>\n'''
          if 'id="previewServiceWorkerCleanup"' not in html:
              html = html.replace('  <script src="app.js?v=13.22-dev26"></script>\n', cleanup + '  <script src="app.js?v=13.22-dev26"></script>\n', 1)

          # Add a build-specific iPhone/Safari entry page to defeat restored page snapshots.
          no_cache_meta = '  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n  <meta http-equiv="Pragma" content="no-cache">\n  <meta http-equiv="Expires" content="0">\n'
          versioned = html
          if no_cache_meta not in versioned:
              versioned = versioned.replace('  <meta name="viewport"', no_cache_meta + '  <meta name="viewport"', 1)
          Path('site/draw-dev3.html').write_text(versioned, encoding='utf-8')

          p.write_text(html, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload preview site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
