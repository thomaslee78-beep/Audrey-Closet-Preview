name: Deploy Cutout Phase 3C fix6 (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix6
        uses: actions/checkout@v4
        with:
          repository: thomaslee78-beep/Audrey-Closet
          ref: v13.23-cutout-phase3a
          path: site
      - name: Note
        run: echo "Historical fix6 workflow retained for manual use only."
